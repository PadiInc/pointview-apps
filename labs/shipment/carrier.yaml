# Carrier status: the provider side of padi.test.shipment, the Connection
# Profile for one party reporting shipment status to another. A demo app, kept
# in labs/ so it is published but not listed in the store. Add it to a group by
# this file's address:
#   https://padiinc.github.io/pointview-apps/labs/shipment/carrier.yaml
# together with the Shipment tracker (tracker.yaml).
pointview_app: 1
id: io.padi.shipment.carrier
name: "Carrier status"
summary: "A carrier reports the status of its shipments to the trackers in this group"
publisher:
  name: "Padi"
  contact: "support@padi.io"
launch: "https://padiinc.github.io/pointview-apps/labs/shipment/carrier.html"
fits:
  people: true
  groups: true
# The app keeps the carrier's own shipment list in this browser, so it needs
# to be itself (its own storage) rather than a page with no origin.
frame: own_origin
connections:
  - profile: "padi.test.shipment"
    role: provider
