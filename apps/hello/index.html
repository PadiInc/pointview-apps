<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- GitHub Pages sends no headers, so the page's own rule is here: only this app's files, nothing from elsewhere. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="hello.js"></script>
</head>
<body>
<main>
  <p id="greeting" class="greeting" aria-live="polite">Press the button.</p>
  <button id="hello" type="button">Hello</button>
</main>
</body>
</html>
