pointview_app: 1
id: io.example.good
name: "Good"
summary: "A good app"
publisher:
  name: "Example"
launch: "https://padiinc.github.io/pointview-apps/apps/good/"
fits:
  people: true
  groups: true
connections:
  - profile: "padi.test.app.good"
    role: consumer
settings:
  - id: colour
    label: "Colour"
    type: choice
    choices:
      - value: red
        label: "Red"
      - value: blue
        label: "Blue"
    default: blue
  - id: loud
    label: "Loud"
    type: toggle
